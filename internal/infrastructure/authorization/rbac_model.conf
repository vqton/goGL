# RBAC access model for the goGL ERP API.
#
# Enforcement triple:
#   sub = the authenticated subject (user id)
#   obj = the matched route pattern, e.g. /api/v1/cash/vouchers/:id
#   act = the HTTP method (GET, POST, PUT, DELETE, ...)
#
# Policy rules:
#   p = subject, object, action     (subject may be a user id or a role)
#   g = user, role                  (role inheritance, also role -> role)
#
# "*" on object or action is a wildcard. Objects also support the keyMatch2
# syntax used by REST-style routes, e.g. /api/v1/cash/*.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (p.obj == "*" || keyMatch2(r.obj, p.obj)) && (p.act == "*" || p.act == r.act)
