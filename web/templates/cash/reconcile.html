{{ define "reconcile" }}<!DOCTYPE html>
<html lang="vi">
<head>{{ template "shell_head" . }}<title>Đối chiếu cuối tháng — goGL</title></head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
{{ template "shell_nav" . }}
<main class="mx-auto max-w-2xl px-4 py-8">
  <h1 class="text-2xl font-bold tracking-tight">Đối chiếu quỹ cuối tháng</h1>
  <p class="mt-1 text-sm text-slate-500">Nhập số dư theo sổ kế toán; hệ thống so với số dư thủ quỹ và lập biên bản đối chiếu.</p>
  {{ template "shell_flash" .Flash }}
  <form method="post" action="/cash/reconcile" class="mt-4 space-y-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="block text-sm">
        <span class="mb-1 block font-medium text-slate-700">Quỹ</span>
        <select name="fund_id" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
          {{ range .Funds }}<option value="{{ .ID }}">{{ .Name }} ({{ .Currency }})</option>{{ end }}
        </select>
      </label>
      <label class="block text-sm">
        <span class="mb-1 block font-medium text-slate-700">Kỳ (tháng)</span>
        <input type="month" name="period" value="{{ .Month }}" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </label>
    </div>
    <label class="block text-sm">
      <span class="mb-1 block font-medium text-slate-700">Số dư theo sổ kế toán</span>
      <input type="number" name="accountant_balance" min="0" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
    </label>
    <div class="flex justify-end">
      <button class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Đối chiếu</button>
    </div>
  </form>
</main>
</body></html>{{ end }}
