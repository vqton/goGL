{{ define "setup_shell_head" }}<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/app.css">{{ end }}

{{ define "setup_shell_nav" }}
<nav class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-2 px-4 py-3">
    <a href="/setup" class="flex items-center gap-2">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 font-bold text-white">G</span>
      <span class="text-lg font-semibold tracking-tight">Khởi tạo hệ thống</span>
    </a>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      {{ if .View.Regime }}
      <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-200">{{ .View.Regime }}</span>
      {{ end }}
      <a href="/" class="rounded-lg px-3 py-1.5 text-slate-400 hover:bg-slate-100">Home</a>
    </div>
  </div>
</nav>
{{ end }}

{{ define "setup_shell_flash" }}
{{ if .Err }}<div class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700">{{ .Err }}</div>{{ end }}
{{ if .Ok }}<div class="mt-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm text-emerald-700">{{ .Ok }}</div>{{ end }}
{{ end }}
